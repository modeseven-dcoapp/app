name: Test
"on":
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize]

jobs:
  test:
    name: test (node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The canary lane runs an odd-numbered "Current" Node release to surface
    # removed-API regressions (such as the deletion of Buffer.SlowBuffer) before
    # they reach an LTS line. It is allowed to fail so the signal is visible
    # without blocking, until the dependency stack is updated to clear it.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - node-version: "20"
          - node-version: "22"
          - node-version: "24"
          - node-version: "25"
            experimental: true
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
